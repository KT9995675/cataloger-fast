<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; margin: 16px; }
      .summary {
        background: #e8f0fe;
        border: 1px solid #c6dafc;
        border-radius: 6px;
        padding: 10px 12px;
        color: #174ea6;
        white-space: pre-wrap;
      }
      .summary.error {
        background: #fce8e6;
        border-color: #f5c6c2;
        color: #c5221f;
      }
      .preview {
        margin-top: 8px;
        color: #444;
        font-size: 12px;
        white-space: pre-wrap;
        max-height: 72px;
        overflow: auto;
      }
      .table-wrap {
        margin-top: 14px;
        border: 1px solid #dadce0;
        border-radius: 6px;
        max-height: 420px;
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      thead th {
        position: sticky;
        top: 0;
        background: #f8f9fa;
        border-bottom: 1px solid #dadce0;
        padding: 8px 6px;
        text-align: center;
        font-weight: bold;
        z-index: 1;
      }
      thead th.subject-col {
        text-align: left;
        min-width: 220px;
      }
      tbody td {
        border-bottom: 1px solid #eee;
        padding: 8px 6px;
        vertical-align: middle;
      }
      tbody tr:nth-child(even) {
        background: #fafafa;
      }
      .subject-name {
        font-weight: 500;
      }
      .subject-meta {
        color: #5f6368;
        font-size: 11px;
        margin-top: 2px;
      }
      .group-badge {
        display: inline-block;
        background: #e8f0fe;
        color: #174ea6;
        border-radius: 4px;
        font-size: 10px;
        padding: 1px 6px;
        margin-right: 6px;
        vertical-align: middle;
      }
      .role-cell {
        text-align: center;
        width: 72px;
      }
      .hint { color: #666; font-size: 12px; margin-top: 8px; }
      .actions { margin-top: 16px; }
      #status { margin-top: 12px; color: #444; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="summaryBox" class="summary">Загрузка…</div>
    <div id="preview" class="preview"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="subject-col">Пользователь / группа</th>
            <th>Редактор</th>
            <th>Комментатор</th>
            <th>Чтение</th>
            <th>Без доступа</th>
          </tr>
        </thead>
        <tbody id="subjectsBody"></tbody>
      </table>
    </div>

    <label id="subtreeWrap" style="display:none; font-weight: normal; margin-top: 12px;">
      <input type="checkbox" id="applySubtree" checked>
      Применить ко всему поддереву выделенных папок
    </label>
    <div id="approvedHint" class="hint" style="display:none;">
      Среди выделенного есть утверждённые файлы: роль «Редактор» для них не применяется (доступны чтение и комментирование).
    </div>
    <div class="hint">«Без доступа» снимает права у субъекта. Владелец файла на Drive не изменяется.</div>

    <div class="actions">
      <button id="saveBtn" onclick="savePermissions()">Сохранить</button>
      <button onclick="google.script.host.close()">Отмена</button>
    </div>
    <div id="status"></div>

    <script>
      var contextResult = <?!= initialContext ?>;
      var context = null;
      var subjects = [];
      var roleLevels = [
        { value: 'edit', title: 'Редактор' },
        { value: 'comment', title: 'Комментатор' },
        { value: 'read', title: 'Чтение' },
        { value: 'none', title: 'Без доступа' }
      ];

      initContext(contextResult);

      function initContext(result) {
        if (!result.ok) {
          showBlocked(result.message || result.error);
          return;
        }
        context = result.data;
        subjects = (context.subjects || []).map(function (item) {
          return {
            subject: item.subject,
            type: item.type,
            label: item.label,
            level: item.level || 'none'
          };
        });
        document.getElementById('summaryBox').textContent = context.summary_message;
        document.getElementById('preview').textContent = (context.preview || []).join('\n');
        if (context.mixed_permissions) {
          document.getElementById('status').textContent =
            'У выделенных элементов разные права. Для всех субъектов выбрано «Без доступа» — задайте роли заново.';
        }
        document.getElementById('subtreeWrap').style.display = context.has_folders ? 'block' : 'none';
        document.getElementById('applySubtree').checked = !!context.apply_to_subtree_default;
        document.getElementById('approvedHint').style.display =
          context.has_approved_files ? 'block' : 'none';
        renderSubjectsTable();
      }

      function showBlocked(message) {
        var box = document.getElementById('summaryBox');
        box.textContent = message;
        box.className = 'summary error';
        document.getElementById('saveBtn').disabled = true;
      }

      function renderSubjectsTable() {
        var tbody = document.getElementById('subjectsBody');
        tbody.innerHTML = '';
        if (!subjects.length) {
          var emptyRow = document.createElement('tr');
          var emptyCell = document.createElement('td');
          emptyCell.colSpan = 5;
          emptyCell.textContent = 'Нет пользователей в Users и групп в Groups.';
          emptyCell.style.color = '#5f6368';
          emptyRow.appendChild(emptyCell);
          tbody.appendChild(emptyRow);
          document.getElementById('saveBtn').disabled = true;
          return;
        }

        for (var i = 0; i < subjects.length; i++) {
          (function (index) {
            var item = subjects[index];
            var tr = document.createElement('tr');

            var nameTd = document.createElement('td');
            var nameDiv = document.createElement('div');
            nameDiv.className = 'subject-name';
            nameDiv.textContent = item.label || item.subject;
            nameTd.appendChild(nameDiv);
            var metaDiv = document.createElement('div');
            metaDiv.className = 'subject-meta';
            metaDiv.textContent = item.subject;
            nameTd.appendChild(metaDiv);
            tr.appendChild(nameTd);

            for (var l = 0; l < roleLevels.length; l++) {
              var level = roleLevels[l];
              var roleTd = document.createElement('td');
              roleTd.className = 'role-cell';
              var radio = document.createElement('input');
              radio.type = 'radio';
              radio.name = 'role-' + index;
              radio.value = level.value;
              radio.title = level.title;
              radio.checked = item.level === level.value;
              radio.addEventListener('change', function () {
                if (this.checked) {
                  subjects[index].level = this.value;
                }
              });
              roleTd.appendChild(radio);
              tr.appendChild(roleTd);
            }

            tbody.appendChild(tr);
          })(i);
        }
      }

      function collectPermissions() {
        var result = [];
        for (var i = 0; i < subjects.length; i++) {
          var item = subjects[i];
          var level = 'none';
          var radios = document.getElementsByName('role-' + i);
          for (var r = 0; r < radios.length; r++) {
            if (radios[r].checked) {
              level = radios[r].value;
              break;
            }
          }
          if (!level || level === 'none') {
            continue;
          }
          result.push({
            subject: item.subject,
            type: item.type || 'user',
            level: level,
            display_name: item.label || item.subject
          });
        }
        return result;
      }

      function savePermissions() {
        document.getElementById('saveBtn').disabled = true;
        document.getElementById('status').textContent = 'Сохраняем…';
        var payload = JSON.stringify(collectPermissions());
        var applySubtree = document.getElementById('applySubtree').checked;
        google.script.run
          .withSuccessHandler(function (result) {
            if (!result.ok) {
              showError(result.message || result.error);
              document.getElementById('saveBtn').disabled = false;
              return;
            }
            document.getElementById('status').textContent = result.message || 'Готово.';
            setTimeout(function () { google.script.host.close(); }, 1200);
          })
          .withFailureHandler(function (err) {
            showError(err);
            document.getElementById('saveBtn').disabled = false;
          })
          .assignCatalogPermissions(payload, applySubtree);
      }

      function showError(message) {
        document.getElementById('status').textContent = String(message);
      }
    </script>
  </body>
</html>
