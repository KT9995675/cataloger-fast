<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; margin: 16px; }
      label { display: block; margin-top: 12px; font-weight: bold; }
      input, select {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 8px;
      }
      .location {
        background: #e8f0fe;
        border: 1px solid #c6dafc;
        border-radius: 6px;
        padding: 10px 12px;
        color: #174ea6;
        font-weight: bold;
        white-space: pre-wrap;
      }
      .location.error {
        background: #fce8e6;
        border-color: #f5c6c2;
        color: #c5221f;
      }
      .hint { color: #666; font-size: 12px; margin-top: 4px; }
      .actions { margin-top: 20px; }
      #status { margin-top: 12px; color: #444; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="parentInfo" class="location">Загрузка…</div>

    <label for="fileKind">Тип файла</label>
    <select id="fileKind"></select>

    <label for="fileName">Имя (без префикса)</label>
    <input id="fileName" type="text" placeholder="Например: Отчёт">
    <div class="hint">Создаётся пустой Google-файл на Drive и строка в каталоге.</div>

    <div class="actions">
      <button id="createBtn" onclick="createFile()">Создать</button>
      <button onclick="google.script.host.close()">Отмена</button>
    </div>
    <div id="status"></div>

    <script>
      var contextResult = <?!= initialContext ?>;
      var context = null;

      if (!contextResult.ok) {
        showError(contextResult.message || contextResult.error);
        document.getElementById('createBtn').disabled = true;
        document.getElementById('parentInfo').textContent = 'Не удалось определить место создания.';
        document.getElementById('parentInfo').className = 'location error';
      } else {
        context = contextResult.data;
        document.getElementById('parentInfo').textContent =
          context.location_message || ('Родительская папка: ' + context.parent_label);
        var select = document.getElementById('fileKind');
        (context.file_kinds || []).forEach(function (kind) {
          var opt = document.createElement('option');
          opt.value = kind.id;
          opt.textContent = kind.label;
          select.appendChild(opt);
        });
        document.getElementById('fileName').focus();
      }

      function createFile() {
        if (!context) {
          showError('Контекст не загружен.');
          return;
        }
        var name = document.getElementById('fileName').value.trim();
        if (!name) {
          showError('Введите имя файла.');
          return;
        }
        var fileKind = document.getElementById('fileKind').value;
        document.getElementById('createBtn').disabled = true;
        document.getElementById('status').textContent = 'Создаём файл…';
        google.script.run
          .withSuccessHandler(function (result) {
            if (!result.ok) {
              showError(result.message || result.error);
              document.getElementById('createBtn').disabled = false;
              return;
            }
            google.script.host.close();
          })
          .withFailureHandler(function (err) {
            showError(err);
            document.getElementById('createBtn').disabled = false;
          })
          .createCatalogFile(context.parent_id, name, fileKind);
      }

      function showError(message) {
        document.getElementById('status').textContent = String(message);
      }
    </script>
  </body>
</html>
