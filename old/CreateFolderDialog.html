<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; margin: 16px; }
      label { display: block; margin-top: 12px; font-weight: bold; }
      input { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px; }
      .hint { color: #666; font-size: 12px; margin-top: 4px; }
      .location {
        background: #e8f0fe;
        border: 1px solid #c6dafc;
        border-radius: 6px;
        padding: 10px 12px;
        color: #174ea6;
        font-weight: bold;
        white-space: pre-wrap;
      }
      .location.error {
        background: #fce8e6;
        border-color: #f5c6c2;
        color: #c5221f;
      }
      .actions { margin-top: 20px; }
      #status { margin-top: 12px; color: #444; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="parentInfo" class="location"></div>
    <label for="folderName">Имя папки (без префикса)</label>
    <input id="folderName" type="text" placeholder="Например: Проекты">
    <div class="hint">Префикс с кодом папки добавится автоматически.</div>
    <div class="actions">
      <button id="createBtn" onclick="createFolder()">Создать</button>
      <button onclick="google.script.host.close()">Отмена</button>
    </div>
    <div id="status"></div>
    <script>
      var contextResult = <?!= initialContext ?>;
      var context = null;
      var parentInfo = document.getElementById('parentInfo');

      if (!contextResult.ok) {
        showError(contextResult.message || contextResult.error);
        document.getElementById('createBtn').disabled = true;
        parentInfo.textContent = 'Не удалось определить место создания.';
        parentInfo.className = 'location error';
      } else {
        context = contextResult.data;
        parentInfo.textContent =
          context.location_message || ('Родительская папка: ' + context.parent_label);
        document.getElementById('folderName').focus();
      }

      function createFolder() {
        if (!context) {
          showError('Контекст не загружен.');
          return;
        }
        var name = document.getElementById('folderName').value.trim();
        if (!name) {
          showError('Введите имя папки.');
          return;
        }
        document.getElementById('createBtn').disabled = true;
        document.getElementById('status').textContent = 'Создаём папку…';
        google.script.run
          .withSuccessHandler(function (result) {
            if (!result.ok) {
              showError(result.message || result.error);
              document.getElementById('createBtn').disabled = false;
              return;
            }
            google.script.host.close();
          })
          .withFailureHandler(function (err) {
            showError(err);
            document.getElementById('createBtn').disabled = false;
          })
          .createVirtualFolder(context.parent_id, name);
      }

      function showError(err) {
        document.getElementById('status').textContent = String(err);
      }
    </script>
  </body>
</html>
