<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; margin: 16px; }
      .item { margin: 8px 0; }
      .actions { margin-top: 16px; }
      #status { margin-top: 12px; color: #444; }
    </style>
  </head>
  <body>
    <p>У следующих файлов владелец не вы. Передать владение вам?</p>
    <div id="list"></div>
    <div class="actions">
      <button id="transferBtn" onclick="transfer()">Передать владение</button>
      <button onclick="google.script.host.close()">Пропустить</button>
    </div>
    <div id="status"></div>
    <script>
      var files = [];

      google.script.run
        .withSuccessHandler(render)
        .withFailureHandler(showError)
        .getOwnerTransferCandidates();

      function render(items) {
        files = items || [];
        var list = document.getElementById('list');
        if (!files.length) {
          list.textContent = 'Нет файлов для передачи.';
          document.getElementById('transferBtn').disabled = true;
          return;
        }
        files.forEach(function (file, index) {
          var div = document.createElement('div');
          div.className = 'item';
          div.innerHTML =
            '<label><input type="checkbox" data-index="' + index + '" checked> ' +
            escapeHtml(file.name) + ' (' + escapeHtml(file.owner_email) + ')</label>';
          list.appendChild(div);
        });
      }

      function transfer() {
        var checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
        var fileIds = [];
        checkboxes.forEach(function (cb) {
          var index = Number(cb.getAttribute('data-index'));
          if (files[index]) {
            fileIds.push(files[index].file_id);
          }
        });
        if (!fileIds.length) {
          showError('Выберите хотя бы один файл.');
          return;
        }
        document.getElementById('transferBtn').disabled = true;
        document.getElementById('status').textContent = 'Передаём владение...';
        google.script.run
          .withSuccessHandler(function (result) {
            document.getElementById('status').textContent = result.message || 'Готово.';
            setTimeout(function () { google.script.host.close(); }, 1200);
          })
          .withFailureHandler(showError)
          .transferOwnershipFromFirstScan(fileIds);
      }

      function showError(err) {
        document.getElementById('status').textContent = String(err);
        document.getElementById('transferBtn').disabled = false;
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }
    </script>
  </body>
</html>
